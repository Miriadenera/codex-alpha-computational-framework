# netlify.toml
# Metti questo file nella ROOT del repository codex-alpha-computational-framework

[build]
  # Netlify eseguirà questi comandi quando fai push diretto (senza GitHub Actions)
  base    = "dashboard"
  command = "npm ci && npm run build"
  publish = "dashboard/dist"

# ── SPA routing ─────────────────────────────────────────────────────────────
# Tutte le route interne della React app vengono gestite da index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Headers di sicurezza ─────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── Cache lunga per gli asset statici (JS/CSS con hash nel nome) ─────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── I file JSON dei dati non devono essere cachati a lungo ───────────────────
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
